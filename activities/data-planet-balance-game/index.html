<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 플래닛 · 밸런스게임</title><link rel="stylesheet" href="style.css?v=tablet-1"><link rel="stylesheet" href="../../tablet-activities.css?v=1"><link rel="stylesheet" href="tablet.css?v=1"></head><body><main id="stage">
<section id="home" class="screen home"><div class="home-copy"><p class="chapter">데이터 플래닛 · 3차시</p><h1>데이터 시각화<br><span>밸런스게임</span></h1><p class="subtitle">더 잘 보이는 그래프를 골라라!</p></div><div class="home-actions"><button id="launch" class="start">▶ 게임 시작</button><button id="settings" class="quiet">상황 선택 · 데이터 바꾸기</button></div></section>
<section id="intro" class="screen intro" hidden><p class="chapter">탐험 준비!</p><h2>같은 데이터, 두 가지 표현</h2><div class="instructions"><div><b>01</b><p>상황을 읽어요.</p></div><div><b>02</b><p>더 잘 전달하는<br>그래프를 눌러요.</p></div><div><b>03</b><p>결승에서 나의<br>챔피언을 골라요!</p></div></div><p class="intro-note">정답보다 중요한 건, 내가 선택한 이유!</p><button id="ready" class="start">준비 완료! 출발 →</button></section>
<section id="game" class="screen game" hidden><header class="game-top"><button id="homeBtn" class="icon" aria-label="시작 화면으로">⌂</button><span id="round"></span><span id="progress"></span><button id="fullscreen" class="icon" aria-label="전체 화면">⛶</button></header><div class="situation"><span id="topic"></span><h2 id="question"></h2></div><div id="cards" class="cards"></div></section>
<section id="result" class="screen result" hidden></section></main><div class="rotate">↻ 태블릿을 가로로 돌리면 더 크게 보여요.</div>
<dialog id="setup"><h2>탐험할 상황 선택</h2><div id="scenarios"></div><details><summary>선택한 상황의 데이터 바꾸기</summary><form id="editForm"><p>한 줄에 ‘항목, 값’ · 3~10개 · 1~100의 정수</p><textarea id="input" rows="6" aria-label="항목과 값"></textarea><p id="error" role="alert"></p><button class="small-button" type="submit">데이터 적용</button></form></details><button id="closeSetup" class="small-button">완료</button></dialog>
<dialog id="reflection"><h2>내 선택 이야기하기</h2><p id="feedback"></p><label for="reason">이 그래프를 고른 이유는?</label><textarea id="reason" rows="3" placeholder="나는 …을 알기 쉬워서 골랐어요."></textarea><button id="download" class="small-button">기록 저장</button><button id="closeReflection" class="small-button">닫기</button></dialog><script src="app.js?v=20261028-cloud2"></script><script src="tablet.js?v=1"></script></body></html>
