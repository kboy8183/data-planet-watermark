<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>데이터 테트리스</title><link rel="stylesheet" href="style.css"></head><body><main class="arcade" id="game-root"><header><div class="logo"><i>▦</i><h1>데이터 <span>테트리스</span></h1></div><div class="top-buttons"><button id="pause" aria-label="일시정지" disabled>Ⅱ</button><button id="reset" aria-label="다시 시작">↻</button></div></header><div class="game-layout">
<section class="well mint"><div class="well-title"><span class="type-icon">123</span><h2>수치형</h2><span class="well-number">01</span></div><div class="board" id="board0" aria-label="수치형 테트리스 판"><div class="grid"></div><div class="pieces"></div></div><button class="choose" data-board="0">← 수치형으로</button></section>
<aside class="dashboard"><div class="status-top"><i></i><span id="status">READY</span></div><div class="mascot" id="mascot" role="img" aria-label="민트색 로봇"></div><div class="speech" id="speech" aria-live="polite">준비됐어?</div><div class="current-card" id="current-card"><span id="current-title">먼저 골라줘!</span><div id="current-shape" class="current-shape"></div><strong id="current-text">?</strong><div class="choice-arrows">← 수치형 · 범주형 →</div></div><div class="score-box"><span>SCORE</span><strong id="score">0000</strong><div class="mini-stats"><div><span>LEVEL</span><b id="level">01</b></div><div><span>LINES</span><b id="lines">00</b></div></div></div><div class="chain" id="chain">✦ LET’S PLAY ✦</div></aside>
<section class="well lilac"><div class="well-title"><span class="type-icon">가나다</span><h2>범주형</h2><span class="well-number">02</span></div><div class="board" id="board1" aria-label="범주형 테트리스 판"><div class="grid"></div><div class="pieces"></div></div><button class="choose" data-board="1">범주형으로 →</button></section></div>
<nav class="control-deck" aria-label="게임 조작"><div class="control-group"><button id="move-left" aria-label="왼쪽 이동">←</button><button id="rotate" aria-label="블록 회전">↻<small>회전</small></button><button id="move-right" aria-label="오른쪽 이동">→</button><button id="soft-drop" aria-label="한 칸 내리기">↓<small>내리기</small></button></div><button id="hard-drop" class="drop">내려놓기 <span>SPACE ↓</span></button></nav><div class="key-guide"><span>← → 이동</span><span>↑ 회전</span><span>A · D 분류 선택</span><span>SPACE 내려놓기</span></div>
<div class="screen" id="screen"><div class="screen-card"><div id="tutorial-robot" class="mascot screen-mascot" role="img" aria-label="반기는 로봇"></div><div class="tiny">DATA BLOCK ARCADE</div><h2 id="screen-title">데이터 테트리스</h2><p id="screen-score" hidden></p><div id="tutorial-content" hidden aria-live="polite"><span id="tutorial-count"></span><p id="tutorial-text"></p><div id="tutorial-example"></div></div><div class="intro-actions"><button id="tutorial-back" hidden>← 이전</button><button id="play">게임 시작 <span>▶</span></button></div></div></div><div class="screen" id="answer-screen" hidden role="dialog" aria-modal="true" aria-labelledby="answer-title"><div class="screen-card answer-card"><div id="answer-symbol" class="answer-symbol"></div><h2 id="answer-title"></h2><div id="answer-data" class="answer-data"></div><p id="answer-explanation"></p><div id="answer-penalty" hidden></div><button id="continue">블록 놓기 <span>↓</span></button></div></div></main><script src="engine.js"></script><script src="game.js"></script></body></html>
